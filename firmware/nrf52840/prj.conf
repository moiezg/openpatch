# OpenPatch pump firmware (Seeed XIAO nRF52840, Zephyr)

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_WATCHDOG=y
CONFIG_LOG=y

# Bluetooth: one bonded controller, LE Secure Connections with a fixed passkey (MITM-protected)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="OpenPatch"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_FIXED_PASSKEY=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# Persistence: settings (config, bonds, state snapshot) on NVS; delivery history on an FCB log
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FCB=y

# USB shell for provisioning and bench tests (the board routes the console to USB CDC-ACM)
CONFIG_SHELL=y
