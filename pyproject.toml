[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openpatch"
version = "0.1.0"
description = "Personal closed-loop insulin research toolkit: MPC controller, safety layer, pump protocol, simulator, web app"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.22"]

[project.scripts]
openpatch = "openpatch.cli:main"

[tool.setuptools.packages.find]
include = ["openpatch*"]

[tool.setuptools.package-data]
openpatch = ["web/*"]
